name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Clone internal dev assets (.pt/)
        run: |
          git clone https://x-access-token:${{ secrets.ISTUEN_PAT }}@github.com/istuen/pt-internal.git .pt
          git -C .pt config user.name "istuen"
          git -C .pt config user.email "istuen@users.noreply.github.com"
          # v0.2.0 multi-pack 布局适配：clone 后建 symlink（等价本地 setup-pt-symlinks.sh）
          # pt-internal 仓根有 pt-project/（prj pack）+ fullstack/（settings pack）
          # 主仓 .pi/settings.json 期望 .pt/assets + .pt/packs/fullstack
          ln -s pt-project .pt/assets
          mkdir -p .pt/packs
          ln -s ../fullstack .pt/packs/fullstack

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不设置 registry-url，让 npm CLI 完全 native 检测 OIDC

      # ★ 升级 npm 到 11+（CI 默认 10.x 不支持 OIDC / Trusted Publishing）
      - run: npm install -g npm@latest
      - run: npm --version  # 验证升级

      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      # issue pt-dist-builtin-schemas-missing：release 也须 sync 检查（与 ci.yml 同款），
      #   防 dist 产物缺目录（如 builtin/schemas）被发版流出
      - name: Build + check dist/builtin vs src/builtin sync
        run: |
          npm run build
          if [[ -n "$(diff -r src/builtin dist/builtin 2>&1)" ]]; then
            echo "::error::dist/builtin 与 src/builtin 不同步——build 后仍有差异（npm pack 内嵌 dist 是过期产物）"
            diff -r src/builtin dist/builtin || true
            exit 1
          fi

      - run: npm publish --access public  # ★ Trusted Publishing (OIDC) — npm 11+ 自动用 Actions ID token

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
